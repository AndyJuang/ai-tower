<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="tower-token" content="__TOWER_TOKEN__">
<title>AI Tower</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="title-row">
    <h1><span class="tw">▲</span> AI TOWER <small class="ver">v0.2.1</small></h1>
    <div class="mode" id="mode" role="group" aria-label="Dispatch mode">
      <button type="button" data-mode="MANUAL">MANUAL</button><button type="button" data-mode="AUTO">AUTO PILOT</button>
    </div>
    <div class="ap-hint" id="ap-hint"></div>
    <div class="clock" aria-label="Taipei time"><span id="clock"></span><small><span id="clock-date"></span></small></div>
  </div>
  <div class="airlines" id="airlines" aria-label="Airlines"></div>
</header>
<section class="starbase" id="starbase">
  <header class="sb-bar">
    <h2>StarBase <span class="zh">發射場</span></h2>
    <span class="sb-sub">三位 DEV Grok Bot</span>
    <span class="count" id="sb-count"></span>
    <button type="button" class="sb-toggle" id="sb-toggle" aria-expanded="true" aria-controls="sb-pads" title="收合 StarBase">▾</button>
  </header>
  <div class="sb-pads" id="sb-pads"></div>
</section>
<main class="bays" id="bays">
  <section class="bay" data-bay="park">
    <header><h2>PARK <span class="zh">待辦</span></h2><span class="count" id="park-count"></span></header>
    <div class="filters">
      <input id="f-q" type="search" placeholder="搜尋標題或 #號碼" aria-label="搜尋">
      <select id="f-ms" aria-label="Milestone"></select>
      <select id="f-repo" aria-label="Repo"></select>
    </div>
    <ol class="lane-active" id="park-sched"></ol>
    <ol class="rack park-rack" id="park-rack" data-drop="park" data-empty="沒有符合的 open issue"></ol>
    <details class="manual-sec" id="manual-sec" hidden>
      <summary><span class="wr" aria-hidden="true">🔧</span> <span id="manual-title">需要實機 · 手動測試</span> <span class="count" id="manual-count"></span></summary>
      <p class="hint">背景 agent 沒有 GUI — 這些不能排進 READY，Auto Pilot 也不會選。</p>
      <ol class="rack manual-rack" id="manual-rack" data-empty="沒有符合的實機驗證 issue"></ol>
    </details>
  </section>
  <section class="bay" data-bay="ready">
    <header><h2>READY TO FLY <span class="zh">排班</span></h2><span class="count" id="ready-count"></span></header>
    <div id="lanes" class="lanes"></div>
  </section>
  <section class="bay" data-bay="takeoff">
    <header><h2>TAKEOFF <span class="zh">飛行中</span></h2><span class="count" id="takeoff-count"></span></header>
    <ol class="rack" id="takeoff-rack" data-empty="目前沒有 agent 在飛"></ol>
  </section>
  <section class="bay" data-bay="goodday">
    <header><h2>GOOD DAY <span class="zh">已落地</span></h2><span class="count" id="goodday-count"></span></header>
    <div class="alert" id="alert" hidden></div>
    <ol class="rack" id="goodday-rack" data-empty="最近沒有落地"></ol>
  </section>
</main>
<footer class="foot" id="feed">connecting…</footer>
<div class="undo" id="undo" hidden><button type="button" id="undo-btn">↩ 撤銷剛才的排序調整</button><div class="undo-bar"></div></div>
<div class="toast" id="toast" hidden role="status"></div>
<div class="sr-only" aria-live="assertive" id="live"></div>
<script src="app.js"></script>
</body>
</html>
